<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neighborhood - Unreader</title>
    <style>
        body { font-family: monospace; background: #fff; color: #000; margin: 0; padding: 20px; line-height: 1.4; }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid #000; padding: 20px; }
        h1 { border-bottom: 2px solid #000; padding-bottom: 5px; margin-top: 0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-links a { border: 2px solid #000; padding: 8px 12px; text-decoration: none; color: #000; font-weight: bold; background: #eee; }
        .nav-links a:hover { background: #000; color: #fff; }
        .post-box { border: 2px solid #000; padding: 12px; margin-bottom: 15px; background: #f9f9f9; }
        .post { border: 1px solid #000; padding: 10px; margin-bottom: 10px; background: #fff; }
        textarea, button { font-family: monospace; font-size: 16px; padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 2px solid #000; background: #fff; }
        button { background: #000; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>NEIGHBORHOOD FEED</h1>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="chat.html">Public Chat</a>
            <a href="topics.html">Topics</a>
            <a href="neighbourhood.html">Neighborhood</a>
            <a href="mod.html" id="modLink" style="display:none;">Mod Panel</a>
        </div>

        <div class="post-box">
            <h3>Broadcast to Neighborhood</h3>
            <textarea id="postContent" placeholder="What's happening in your local network?..." rows="3"></textarea>
            <button onclick="sendNeighborhoodPost()">Post Update</button>
        </div>

        <div id="feedList">Loading neighborhood feed...</div>
    </div>

    <script>
        const API_URL = "https://re-reader.onrender.com";
        const WS_URL = "wss://re-reader.onrender.com";
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; }

        // Check user role from token to show mod panel link if applicable
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role === 'admin' || payload.role === 'mod') {
                document.getElementById('modLink').style.display = 'inline-block';
            }
        } catch(e) {}

        let ws;
        function initWebSocket() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', token: token }));
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'neighborhood_update') renderFeed(data.posts);
            };
            ws.onclose = () => setTimeout(initWebSocket, 3000);
        }

        async function renderFeed(posts) {
            const container = document.getElementById('feedList');
            container.innerHTML = '';
            if (!posts || posts.length === 0) {
                container.innerHTML = '<p>No local posts yet.</p>';
                return;
            }
            posts.forEach(p => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `<strong>@${p.username}</strong><p>${p.content}</p><small>${new Date(p.created_at).toLocaleString()}</small>`;
                container.appendChild(div);
            });
        }

        function sendNeighborhoodPost() {
            const content = document.getElementById('postContent').value.trim();
            if (!content) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'neighborhood_post', content: content }));
                document.getElementById('postContent').value = '';
            } else {
                alert('WebSocket offline.');
            }
        }

        initWebSocket();
    </script>
</body>
</html>
