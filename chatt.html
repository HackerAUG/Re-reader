<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Public Chat - Unreader</title>
    <style>
        body { font-family: monospace; background: #fff; color: #000; margin: 0; padding: 20px; line-height: 1.4; }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid #000; padding: 20px; }
        h1 { border-bottom: 2px solid #000; padding-bottom: 5px; margin-top: 0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-links a { border: 2px solid #000; padding: 8px 12px; text-decoration: none; color: #000; font-weight: bold; background: #eee; }
        .nav-links a:hover { background: #000; color: #fff; }
        #chatBox { border: 2px solid #000; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .msg { margin-bottom: 8px; border-bottom: 1px dashed #ccc; padding-bottom: 4px; }
        input, button { font-family: monospace; font-size: 16px; padding: 8px; box-sizing: border-box; border: 2px solid #000; background: #fff; }
        input { width: 75%; }
        button { width: 22%; background: #000; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PUBLIC CHAT</h1>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="chat.html">Public Chat</a>
            <a href="topics.html">Topics</a>
            <a href="neighbourhood.html">Neighborhood</a>
        </div>

        <div id="chatBox">Loading messages...</div>
        
        <div style="display: flex; gap: 5px;">
            <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "https://re-reader.onrender.com";
        const WS_URL = "wss://re-reader.onrender.com";
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token) {
            alert('Please login first via the Dashboard.');
            window.location.href = 'index.html';
        }

        let ws;

        async function loadHistory() {
            try {
                const res = await fetch(`${API_URL}/history?index=0`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                renderMessages(data);
            } catch (err) {
                document.getElementById('chatBox').innerHTML = 'Failed to load message history from Render.';
            }
        }

        function renderMessages(messages) {
            const box = document.getElementById('chatBox');
            box.innerHTML = '';
            messages.forEach(m => {
                if (m.is_deleted) return;
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<strong>@${m.username}:</strong> ${m.content}`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        function initWebSocket() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'auth', token: token }));
                ws.send(JSON.stringify({ type: 'switch_context', mode: 'public', target: '' }));
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'refresh_feed') {
                    loadHistory();
                } else if (data.type === 'terminated') {
                    alert('Session terminated: ' + data.reason);
                    window.location.href = 'index.html';
                }
            };
            ws.onclose = () => {
                setTimeout(initWebSocket, 3000); // Reconnect logic for Kindle / low-JS
            };
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'message', content: content }));
                input.value = '';
            } else {
                alert('WebSocket not connected. Trying to reconnect...');
                initWebSocket();
            }
        }

        loadHistory();
        initWebSocket();
    </script>
</body>
</html>
