<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-reader - Neighborhood</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --hover-bg: #e5e5e5;
        }
        body {
            font-family: "Courier New", Courier, monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.4;
        }
        header {
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        h1, h2 { margin: 0.5rem 0; text-transform: uppercase; }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 0.8rem;
        }
        nav a {
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }
        nav a:hover { background-color: var(--hover-bg); }
        .post-card {
            border: 2px solid var(--border-color);
            padding: 1rem;
            margin-bottom: 1rem;
            background: #fff;
        }
        .post-header {
            font-size: 0.85rem;
            border-bottom: 1px solid #ccc;
            padding-bottom: 0.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }
        form {
            border: 2px solid var(--border-color);
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: #fff;
        }
        input, textarea, button {
            font-family: inherit;
            border: 2px solid var(--border-color);
            padding: 0.4rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0.5rem;
            background: #fff;
        }
        button {
            background: var(--text-color);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background: #444; }
    </style>
</head>
<body>
    <header>
        <h1>[ Neighborhood Bulletin ]</h1>
    </header>

    <nav aria-label="Main Navigation">
        <a href="index.html">[ Dashboard ]</a>
        <a href="chat.html">[ Chat Room ]</a>
        <a href="topics.html">[ Topics / Forum ]</a>
        <a href="neighbourhood.html">[ Neighborhood ]</a>
    </nav>

    <main>
        <section>
            <form id="post-form" method="POST" action="/api/neighbourhood">
                <h2>Broadcast Local Note</h2>
                <div>
                    <label for="author">Your Handle / Station:</label>
                    <input type="text" id="author" name="author" required maxlength="25" value="KindleUser">
                </div>
                <div>
                    <label for="content">Short Note / Update:</label>
                    <textarea id="content" name="content" rows="3" required maxlength="300" placeholder="Share a local update, note, or announcement..."></textarea>
                </div>
                <button type="submit">[ Post Bulletin ]</button>
            </form>
        </section>

        <section>
            <h2>Community Bulletin Board</h2>
            <div id="posts-container">
                <p><em>Loading bulletins...</em></p>
            </div>
        </section>
    </main>

    <script>
        (function() {
            var container = document.getElementById('posts-container');
            var form = document.getElementById('post-form');

            function loadPosts() {
                fetch('/api/neighbourhood')
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (!data || !data.length) {
                            container.innerHTML = '<p><em>No bulletins pinned yet.</em></p>';
                            return;
                        }
                        var html = '';
                        for (var i = 0; i < data.length; i++) {
                            var p = data[i];
                            var dateStr = new Date(p.timestamp).toLocaleString();
                            html += '<div class="post-card">';
                            html += '<div class="post-header"><span><strong>' + escapeHtml(p.author) + '</strong></span><span>' + dateStr + '</span></div>';
                            html += '<p>' + escapeHtml(p.content) + '</p>';
                            html += '</div>';
                        }
                        container.innerHTML = html;
                    })
                    .catch(function(err) {
                        container.innerHTML = '<p>Failed to load neighborhood feed.</p>';
                    });
            }

            function escapeHtml(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var author = document.getElementById('author').value;
                var content = document.getElementById('content').value;
                if (!author || !content) return;

                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/neighbourhood', true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        document.getElementById('content').value = '';
                        loadPosts();
                    }
                };
                xhr.send(JSON.stringify({ author: author, content: content }));
            });

            loadPosts();
        })();
    </script>
</body>
</html>
