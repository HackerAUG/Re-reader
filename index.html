<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Re-reader</title>
    <style>
        body { font-family: monospace; background: #fff; color: #000; margin: 0; padding: 20px; line-height: 1.4; }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid #000; padding: 20px; }
        h1 { border-bottom: 2px solid #000; padding-bottom: 5px; margin-top: 0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-links a { border: 2px solid #000; padding: 8px 12px; text-decoration: none; color: #000; font-weight: bold; background: #eee; }
        .nav-links a:hover { background: #000; color: #fff; }
        .card { border: 2px solid #000; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
        button { font-family: monospace; font-size: 16px; padding: 8px 12px; border: 2px solid #000; background: #000; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DASHBOARD</h1>
        
        <!-- Navigation Links (Mod Panel link is hidden by default) -->
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="chat.html">Public Chat</a>
            <a href="topics.html">Topics</a>
            <a href="neighbourhood.html">Neighborhood</a>
            <a href="mod.html" id="modPanelLink" style="display: none; background: #000; color: #ff0;">Mod Panel</a>
        </div>

        <div class="card">
            <h3>Welcome to Unreader</h3>
            <p>E-ink optimized community client.</p>
            <div id="userStatus">Checking login status...</div>
        </div>

        <div class="card" id="authBox">
            <!-- Login/Logout toggle handled by existing scripts -->
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        
        if (token) {
            try {
                // Decode JWT payload to read user role safely on frontend
                const payload = JSON.parse(atob(token.split('.')[1]));
                document.getElementById('userStatus').innerHTML = `Logged in as: <strong>@${payload.username || 'User'}</strong> (${payload.role.toUpperCase()})`;

                // Show Mod Panel link if user is an admin or mod
                if (payload.role === 'admin' || payload.role === 'mod') {
                    document.getElementById('modPanelLink').style.display = 'inline-block';
                }
            } catch (e) {
                document.getElementById('userStatus').textContent = 'Session token invalid. Please log in again.';
            }
        } else {
            document.getElementById('userStatus').textContent = 'Not logged in.';
        }
    </script>
</body>
</html>
