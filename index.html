<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unreader Dashboard - E-Ink Edition</title>
    <style>
        body { font-family: monospace; background: #fff; color: #000; margin: 0; padding: 20px; line-height: 1.4; }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid #000; padding: 20px; }
        h1, h2 { border-bottom: 2px solid #000; padding-bottom: 5px; margin-top: 0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-links a { border: 2px solid #000; padding: 8px 12px; text-decoration: none; color: #000; font-weight: bold; background: #eee; }
        .nav-links a:hover { background: #000; color: #fff; }
        input, button { font-family: monospace; font-size: 16px; padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 2px solid #000; background: #fff; }
        button { background: #000; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #fff; color: #000; }
        .hidden { display: none !important; }
        .card { border: 1px solid #000; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>UNREADER // E-INK</h1>
        
        <!-- Navigation Hub -->
        <div class="nav-links" id="navMenu">
            <a href="index.html">Dashboard</a>
            <a href="chat.html">Public Chat</a>
            <a href="topics.html">Topics</a>
            <a href="neighbourhood.html">Neighborhood</a>
        </div>

        <!-- Auth Section -->
        <div id="authSection" class="card">
            <h2>Authentication</h2>
            <div id="loginFormContainer">
                <input type="text" id="usernameInput" placeholder="Username (min 3 chars)" autocomplete="username">
                <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
                <button onclick="login()">Login</button>
                <button onclick="register()">Register New Account</button>
            </div>
            <div id="loggedInContainer" class="hidden">
                <p>Logged in as: <strong id="currentUsername"></strong></p>
                <button onclick="logout()">Logout</button>
            </div>
            <p id="authStatus" style="font-weight: bold;"></p>
        </div>

        <!-- System Status -->
        <div class="card">
            <h2>System Status</h2>
            <p>Backend: <code>https://re-reader.onrender.com</code>[cite: 1]</p>
            <p>Target Audience: Low-JS Browsers / Kindles</p>
        </div>
    </div>

    <script>
        const API_URL = "https://re-reader.onrender.com";

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('username');
            if (token && user) {
                document.getElementById('loginFormContainer').classList.add('hidden');
                document.getElementById('loggedInContainer').classList.remove('hidden');
                document.getElementById('currentUsername').textContent = user;
            } else {
                document.getElementById('loginFormContainer').classList.remove('hidden');
                document.getElementById('loggedInContainer').classList.add('hidden');
            }
        }

        async function login() {
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    document.getElementById('authStatus').textContent = 'Login successful!';
                    checkAuth();
                } else {
                    document.getElementById('authStatus').textContent = 'Error: ' + (data.error || 'Login failed');
                }
            } catch (err) {
                document.getElementById('authStatus').textContent = 'Connection error to Render backend.';
            }
        }

        async function register() {
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            try {
                const res = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    document.getElementById('authStatus').textContent = 'Registration & login successful!';
                    checkAuth();
                } else {
                    document.getElementById('authStatus').textContent = 'Error: ' + (data.error || 'Registration failed');
                }
            } catch (err) {
                document.getElementById('authStatus').textContent = 'Connection error to Render backend.';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('authStatus').textContent = 'Logged out.';
            checkAuth();
        }

        checkAuth();
    </script>
</body>
</html>
