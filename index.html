<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Unreader</title>
    <style>
        body { font-family: monospace; background: #fff; color: #000; margin: 0; padding: 20px; line-height: 1.4; }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid #000; padding: 20px; }
        h1, h3 { border-bottom: 2px solid #000; padding-bottom: 5px; margin-top: 0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-links a { border: 2px solid #000; padding: 8px 12px; text-decoration: none; color: #000; font-weight: bold; background: #eee; }
        .nav-links a:hover { background: #000; color: #fff; }
        .card { border: 2px solid #000; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
        input, button { font-family: monospace; font-size: 16px; padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 2px solid #000; background: #fff; }
        button { background: #000; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #fff; color: #000; }
        .hidden { display: none !important; }
        #errorMsg { color: red; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DASHBOARD</h1>
        
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="chat.html">Public Chat</a>
            <a href="topics.html">Topics</a>
            <a href="neighbourhood.html">Neighborhood</a>
            <a href="mod.html" id="modPanelLink" class="hidden" style="background: #000; color: #ff0;">Mod Panel</a>
        </div>

        <div class="card">
            <h3>Welcome to Unreader</h3>
            <p>E-ink optimized community client.</p>
            <div id="userStatus">Checking login status...</div>
        </div>

        <div class="card" id="authSection">
            <div id="loginFormView">
                <h3>Login</h3>
                <input type="text" id="loginUsername" placeholder="Username...">
                <input type="password" id="loginPassword" placeholder="Password...">
                <button onclick="loginUser()">Login</button>
                <div id="errorMsg"></div>
            </div>
            <div id="logoutView" class="hidden">
                <button onclick="logoutUser()">Log Out</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://re-reader.onrender.com";
        const token = localStorage.getItem('token');
        
        if (token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const isAdmin = payload.isAdmin === true || payload.is_admin === true || payload.role === 'admin';
                const isMod = payload.ismod === true || payload.is_mod === true || payload.role === 'mod';
                
                let roleStr = 'User';
                if (isAdmin) roleStr = 'Administrator';
                else if (isMod) roleStr = 'Moderator';

                document.getElementById('userStatus').innerHTML = `Logged in as: <strong>@${payload.username || 'User'}</strong> (${roleStr})`;

                if (isAdmin || isMod) {
                    document.getElementById('modPanelLink').classList.remove('hidden');
                }

                document.getElementById('loginFormView').classList.add('hidden');
                document.getElementById('logoutView').classList.remove('hidden');
            } catch (e) {
                document.getElementById('userStatus').textContent = 'Session token invalid. Please log in again.';
            }
        } else {
            document.getElementById('userStatus').textContent = 'Not logged in.';
        }

        async function loginUser() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errDiv = document.getElementById('errorMsg');
            errDiv.textContent = '';

            if (!username || !password) {
                errDiv.textContent = 'Please enter both username and password.';
                return;
            }

            try {
                // Change `${API_URL}/login` here to `${API_URL}/api/login` if your backend uses a prefix
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                console.log("Login response:", data);

                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    window.location.reload();
                } else {
                    errDiv.textContent = data.error || data.message || 'Login failed.';
                }
            } catch (err) {
                console.error("Login network error:", err);
                errDiv.textContent = 'Network error: Could not reach server.';
            }
        }

        function logoutUser() {
            localStorage.removeItem('token');
            window.location.reload();
        }
    </script>
</body>
</html>
