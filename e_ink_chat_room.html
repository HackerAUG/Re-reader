<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-reader Hub - Chat Room</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --hover-bg: #e5e5e5;
        }
        body {
            font-family: "Courier New", Courier, monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.3;
        }
        header {
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        h1 { margin: 0.5rem 0; font-size: 1.4rem; text-transform: uppercase; }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 0.8rem;
        }
        nav a {
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }
        nav a:hover { background-color: var(--hover-bg); }
        .chat-box {
            border: 2px solid var(--border-color);
            height: 300px;
            overflow-y: scroll;
            padding: 0.8rem;
            margin-bottom: 1rem;
            background: #fff;
        }
        .msg {
            margin-bottom: 0.6rem;
            border-bottom: 1px dotted #666;
            padding-bottom: 0.4rem;
        }
        .msg-author {
            font-weight: bold;
            text-decoration: underline;
        }
        .msg-time {
            font-size: 0.75rem;
            float: right;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border: 2px solid var(--border-color);
            padding: 0.8rem;
            background: #fff;
        }
        input, textarea, button {
            font-family: inherit;
            border: 2px solid var(--border-color);
            padding: 0.5rem;
            font-size: 1rem;
            background: #fff;
            color: #000;
        }
        button {
            background: var(--text-color);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background: #444; }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>[ Live Chat Room ]</h1>
    </header>

    <nav aria-label="Main Navigation">
        <a href="index.html">[ Dashboard ]</a>
        <a href="chat.html">[ Chat Room ]</a>
        <a href="topics.html">[ Topics / Forum ]</a>
        <a href="neighbourhood.html">[ Neighborhood ]</a>
    </nav>

    <main>
        <div class="controls-bar">
            <span>Stream Mode: Low-Power Polling</span>
            <noscript><span><a href="chat.html">[ Manual Refresh ]</a></span></noscript>
        </div>

        <div id="chat-messages" class="chat-box">
            <p><em>Loading messages... (Ensure JS is enabled or refresh)</em></p>
        </div>

        <!-- Standard HTML form with action attribute for zero-JS fallback submission -->
        <form id="chat-form" method="POST" action="/api/chat">
            <div>
                <label for="author">Name / Handle:</label><br>
                <input type="text" id="author" name="author" required maxlength="25" value="Reader">
            </div>
            <div>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="2" required maxlength="250" placeholder="Type a short message..."></textarea>
            </div>
            <button type="submit">[ Send Transmission ]</button>
        </form>
    </main>

    <script>
        (function() {
            var chatBox = document.getElementById('chat-messages');
            var form = document.getElementById('chat-form');

            function loadMessages() {
                fetch('/api/chat')
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (!data || !data.length) {
                            chatBox.innerHTML = '<p><em>No messages yet. Be the first!</em></p>';
                            return;
                        }
                        var html = '';
                        for (var i = 0; i < data.length; i++) {
                            var m = data[i];
                            var timeStr = new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                            html += '<div class="msg">';
                            html += '<span class="msg-time">' + timeStr + '</span>';
                            html += '<span class="msg-author">' + escapeHtml(m.author) + '</span>: ';
                            html += '<span class="msg-text">' + escapeHtml(m.message) + '</span>';
                            html += '</div>';
                        }
                        chatBox.innerHTML = html;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    })
                    .catch(function(err) {
                        // Keep fallback message if fetch fails
                    });
            }

            function escapeHtml(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            // Intercept form submit for smooth polling update without full page reload if supported
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var author = document.getElementById('author').value;
                var message = document.getElementById('message').value;
                if (!author || !message) return;

                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/chat', true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        document.getElementById('message').value = '';
                        loadMessages();
                    }
                };
                xhr.send(JSON.stringify({ author: author, message: message }));
            });

            // Initial load and poll every 8 seconds (gentle on e-ink display refresh cycles)
            loadMessages();
            setInterval(loadMessages, 8000);
        })();
    </script>
</body>
</html>
