<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-reader - Topics &amp; Forum</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --hover-bg: #e5e5e5;
        }
        body {
            font-family: "Courier New", Courier, monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.4;
        }
        header {
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        h1, h2 { margin: 0.5rem 0; text-transform: uppercase; }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 0.8rem;
        }
        nav a {
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }
        nav a:hover { background-color: var(--hover-bg); }
        .topic-card {
            border: 2px solid var(--border-color);
            padding: 0.8rem;
            margin-bottom: 1rem;
            background: #fff;
        }
        .topic-title {
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: underline;
        }
        .meta-info {
            font-size: 0.8rem;
            margin-top: 0.3rem;
            color: #333;
        }
        form {
            border: 2px solid var(--border-color);
            padding: 1rem;
            margin-top: 1.5rem;
            background: #fff;
        }
        input, textarea, button {
            font-family: inherit;
            border: 2px solid var(--border-color);
            padding: 0.4rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0.5rem;
            background: #fff;
        }
        button {
            background: var(--text-color);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background: #444; }
        .reply-box {
            border-top: 1px dotted black;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>[ Discussion Topics ]</h1>
    </header>

    <nav aria-label="Main Navigation">
        <a href="index.html">[ Dashboard ]</a>
        <a href="chat.html">[ Chat Room ]</a>
        <a href="topics.html">[ Topics / Forum ]</a>
        <a href="neighbourhood.html">[ Neighborhood ]</a>
    </nav>

    <main>
        <section>
            <h2>Active Threads</h2>
            <div id="topics-container">
                <p><em>Loading discussion threads...</em></p>
            </div>
        </section>

        <section>
            <form id="topic-form" method="POST" action="/api/topics">
                <h2>Start New Topic</h2>
                <div>
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author" required maxlength="25" value="Reader">
                </div>
                <div>
                    <label for="title">Topic Title:</label>
                    <input type="text" id="title" name="title" required maxlength="60">
                </div>
                <div>
                    <label for="content">Opening Post:</label>
                    <textarea id="content" name="content" rows="3" required maxlength="400"></textarea>
                </div>
                <button type="submit">[ Publish Topic ]</button>
            </form>
        </section>
    </main>

    <script>
        (function() {
            var container = document.getElementById('topics-container');
            var form = document.getElementById('topic-form');

            function loadTopics() {
                fetch('/api/topics')
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (!data || !data.length) {
                            container.innerHTML = '<p><em>No topics posted yet. Start one below!</em></p>';
                            return;
                        }
                        var html = '';
                        for (var i = 0; i < data.length; i++) {
                            var t = data[i];
                            var dateStr = new Date(t.timestamp).toLocaleDateString();
                            html += '<div class="topic-card">';
                            html += '<div class="topic-title">' + escapeHtml(t.title) + '</div>';
                            html += '<div class="meta-info">By <strong>' + escapeHtml(t.author) + '</strong> on ' + dateStr + ' &bull; Replies: ' + t.replies.length + '</div>';
                            html += '<p>' + escapeHtml(t.content) + '</p>';
                            
                            // Render replies if any
                            if (t.replies && t.replies.length > 0) {
                                html += '<div class="reply-box"><strong>Replies:</strong>';
                                for (var j = 0; j < t.replies.length; j++) {
                                    var r = t.replies[j];
                                    html += '<div>&bull; <em>' + escapeHtml(r.author) + '</em>: ' + escapeHtml(r.message) + '</div>';
                                }
                                html += '</div>';
                            }

                            // Simple reply form for each topic
                            html += '<form onsubmit="postReply(event, \'' + t.id + '\')" style="margin-top:0.5rem; padding:0.4rem; border:1px solid #000;">';
                            html += '<input type="text" placeholder="Your name" id="r_author_' + t.id + '" required style="width:30%; display:inline-block; margin-bottom:0.2rem;" value="Reader"> ';
                            html += '<input type="text" placeholder="Quick reply..." id="r_msg_' + t.id + '" required style="width:55%; display:inline-block; margin-bottom:0.2rem;"> ';
                            html += '<button type="submit" style="width:12%; padding:0.2rem;">Reply</button>';
                            html += '</form>';

                            html += '</div>';
                        }
                        container.innerHTML = html;
                    })
                    .catch(function(err) {
                        container.innerHTML = '<p>Failed to load topics. Check server connection.</p>';
                    });
            }

            window.postReply = function(e, topicId) {
                e.preventDefault();
                var author = document.getElementById('r_author_' + topicId).value;
                var message = document.getElementById('r_msg_' + topicId).value;
                if (!author || !message) return;

                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/topics/' + topicId + '/reply', true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        loadTopics();
                    }
                };
                xhr.send(JSON.stringify({ author: author, message: message }));
            };

            function escapeHtml(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var author = document.getElementById('author').value;
                var title = document.getElementById('title').value;
                var content = document.getElementById('content').value;
                if (!author || !title || !content) return;

                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/topics', true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        document.getElementById('title').value = '';
                        document.getElementById('content').value = '';
                        loadTopics();
                    }
                };
                xhr.send(JSON.stringify({ author: author, title: title, content: content }));
            });

            loadTopics();
        })();
    </script>
</body>
</html>
